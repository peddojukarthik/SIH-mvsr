<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 380px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 16px; padding: 10px 18px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; width: 100%; }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; }
  #status.error { background: #fef2f2; color: #991b1b; display: block; }
</style>
</head>
<body>

<h1>Secure DMS — Login</h1>
<input id="employee-id" placeholder="Employee ID" />
<input id="password" type="password" placeholder="Password" />
<button onclick="login()">Log In</button>
<div id="status"></div>

<script>
const API = "https://alliance-cqnf.onrender.com";

async function login() {
  const employee_id = document.getElementById("employee-id").value;
  const password = document.getElementById("password").value;
  const statusDiv = document.getElementById("status");

  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employee_id, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      statusDiv.className = "error";
      statusDiv.textContent = data.detail;
      return;
    }

    // Store everything the homepage needs to decide what to render.
    // sessionStorage clears when the tab closes - reasonable for a demo;
    // a real deployment might use a more persistent + secure approach.
    sessionStorage.setItem("token", data.token);
    sessionStorage.setItem("full_name", data.full_name);
    sessionStorage.setItem("department_type", data.department_type);
    sessionStorage.setItem("department_name", data.department_name);
    sessionStorage.setItem("is_admin", data.is_admin);
    sessionStorage.setItem("has_2fa", data.has_2fa);
    sessionStorage.setItem("is_department_head", data.is_department_head || false);

    // THE FIRST-LOGIN GATE: profile not completed yet -> force that
    // page instead of the homepage, no way around it.
    if (data.account_status === "activated" || data.account_status === "profile_pending") {
      window.location.href = "profile-setup.html";
    } else {
      // Honor a ?redirect=... param so pages like invite-case.html that
      // bounced you here can send you back to where you meant to go,
      // instead of always dropping you on the generic homepage.
      const params = new URLSearchParams(window.location.search);
      const redirectTo = params.get("redirect");
      window.location.href = redirectTo ? decodeURIComponent(redirectTo) : "homepage.html";
    }
  } catch (err) {
    statusDiv.className = "error";
    statusDiv.textContent = `Login failed: ${err.message}`;
  }
}
</script>

</body>
</html>
