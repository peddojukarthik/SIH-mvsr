<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Secure DMS</title><style>body{font-family:system-ui;max-width:520px;margin:50px auto;padding:20px;background:#f8fafc}.card{background:#fff;padding:24px;border-radius:14px;border:1px solid #ddd}input{width:100%;box-sizing:border-box;padding:11px;margin:8px 0 14px;border:1px solid #ccc;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff}.status{padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}</style></head><body><div class="card"><h1>Activate Secure DMS</h1><p>Create the password you will use to sign in.</p><label>Password</label><input id="p" type="password"><label>Confirm password</label><input id="c" type="password"><button id="b">Activate Account</button><div id="s"></div></div><script>const API=location.origin;const t=new URLSearchParams(location.search).get('token');const s=document.getElementById('s');document.getElementById('b').onclick=async()=>{const p=document.getElementById('p').value,c=document.getElementById('c').value;if(p!==c){s.className='status error';s.textContent='Passwords do not match.';return}try{const r=await fetch(API+'/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Activation failed');s.className='status success';s.textContent='Account activated. You can now log in.';setTimeout(()=>location.href='login.html',1200)}catch(e){s.className='status error';s.textContent=e.message}}</script></body></html>
