<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEMESIS External Case Portal</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f8fafc;color:#172033}.card{background:white;border:1px solid #dbe2ea;border-radius:14px;padding:22px;margin:14px 0}input,select{width:100%;padding:10px;box-sizing:border-box;margin:7px 0 12px;border:1px solid #cbd5e1;border-radius:8px}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.meta{color:#64748b}.ok{background:#ecfdf5;color:#065f46;padding:10px;border-radius:8px}.err{background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px}</style></head><body><div class="card"><h1>NEMESIS External Case Portal</h1><div id="info">Loading invitation…</div></div><div id="app"></div><script>
const API="http://127.0.0.1:8000", token=new URLSearchParams(location.search).get('token');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(p,o={}){let r=await fetch(API+p,{...o});let t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch{d={detail:t}}if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function init(){if(!token)throw Error('Invitation token is missing.');let d=await api('/external/invite?token='+encodeURIComponent(token));document.getElementById('info').innerHTML=`<b>${esc(d.name)}</b><div class="meta">${esc(d.organization_name||'External participant')} · ${esc(d.role)}</div><div class="meta">Case: ${esc(d.case_id)} · Access: ${esc(d.permission_level)}</div><div class="meta">Allowed: ${d.allowed_document_types.map(esc).join(', ')}</div>`;await api('/external/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});document.getElementById('app').innerHTML=`<div class="card"><h2>Submit Case Document</h2><p class="meta">Uploads are immutable. If this document type already exists in the case, this upload becomes the next version.</p><label>Document Type</label><select id="type">${d.allowed_document_types.map(x=>`<option value="${esc(x)}">${esc(x.replaceAll('_',' '))}</option>`).join('')}</select><input id="file" type="file"><button id="upload">Upload</button><div id="status"></div></div>`;document.getElementById('upload').onclick=async()=>{let f=document.getElementById('file').files[0],st=document.getElementById('status');if(!f){st.className='err';st.textContent='Choose a file.';return}let fd=new FormData();fd.append('token',token);fd.append('document_type',document.getElementById('type').value);fd.append('file',f);try{let r=await api('/external/documents/upload',{method:'POST',body:fd});st.className='ok';st.textContent=r.message+' SHA-256: '+r.file_hash}catch(e){st.className='err';st.textContent=e.message}}}
init().catch(e=>document.getElementById('info').innerHTML='<div class="err">'+esc(e.message)+'</div>');</script></body></html>
