<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure DMS — Profile</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,var(--soft),transparent 30%),#f5f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033} :root{--accent:#3158d8;--deep:#101a3a;--soft:#eef2ff}.wrap{max-width:820px;margin:auto;padding:26px}.hero{background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;border-radius:23px;padding:25px;box-shadow:0 18px 50px #101a3a24}.brand{display:flex;gap:14px;align-items:center}.mark{width:52px;height:52px;border-radius:16px;background:#ffffff14;border:1px solid #ffffff30;display:grid;place-items:center;font-size:25px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}.hero h1{margin:4px 0}.card{background:#ffffffdf;border:1px solid #dfe5f2;border-radius:20px;padding:24px;margin-top:16px;box-shadow:0 12px 35px #18213b0b}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #dbe2ee;border-radius:11px;background:#fff;font:inherit}button{width:100%;margin-top:19px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.sub{color:#68738a;font-size:13px;line-height:1.55}.status{margin-top:12px;padding:12px;border-radius:11px;display:none}.error{display:block;background:#fff0f1;color:#992631}.success{display:block;background:#e9f8f2;color:#09694f}</style></head><body id="appBody"><div class="wrap"><section class="hero"><div class="brand"><div class="mark" id="mark">◈</div><div><div class="eyebrow">Secure DMS</div><h1>Complete your profile</h1><div id="dept" style="font-size:12px;opacity:.78"></div></div></div></section><section class="card"><p class="sub">Complete your profile before entering the secure workspace.</p><label>Date of birth</label><input id="dob" type="date"><label>Personal address</label><input id="address"><label>Personal phone</label><input id="phone" type="tel"><label>Emergency contact name</label><input id="emergency_name"><label>Emergency contact phone</label><input id="emergency_phone" type="tel"><button id="save">Complete profile</button><div id="status" class="status"></div></section></div><script>
const dept=(sessionStorage.getItem('department_type')||'').toLowerCase();document.body.dataset.department=dept;
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8000':'https://alliance-cqnf.onrender.com',token=sessionStorage.getItem('token');if(!token)location.href='login.html';const type=(sessionStorage.getItem('department_type')||'').toLowerCase(),name=sessionStorage.getItem('department_name')||'';const map={police:['#214bb8','#647cff','#0c1735','#eaf0ff','🛡️'],forensic:['#6b4bb8','#9b78ef','#24163f','#f1ebff','🔬'],fsl:['#6b4bb8','#9b78ef','#24163f','#f1ebff','🧪'],government_hospital:['#087f73','#31b6a5','#073b38','#e5f8f5','✚'],private_hospital:['#087f73','#31b6a5','#073b38','#e5f8f5','✚'],legal:['#8a5a1e','#c5964d','#35230f','#fff5e6','⚖️'],court:['#8a5a1e','#c5964d','#35230f','#fff5e6','⚖️']};const t=map[type]||['#3158d8','#6d7df7','#101a3a','#eef2ff','◈'];document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--deep',t[2]);document.documentElement.style.setProperty('--soft',t[3]);document.getElementById('mark').textContent=t[4];document.getElementById('dept').textContent=name;document.getElementById('save').onclick=async()=>{const body={dob:dob.value,personal_address:address.value.trim(),personal_phone:phone.value.trim(),emergency_contact_name:emergency_name.value.trim(),emergency_contact_phone:emergency_phone.value.trim()};try{const r=await fetch(API+'/profile/complete',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Profile update failed.');status.className='status success';status.textContent='Profile completed. Redirecting…';setTimeout(()=>location.href='homepage.html',700)}catch(e){status.className='status error';status.textContent=e.message}};
</script></body></html>
