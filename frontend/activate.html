<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure DMS — Activate Account</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,#e3eaff,transparent 30%),linear-gradient(135deg,#0d1734,#3158d8);color:#172033}.card{width:min(520px,92vw);background:#ffffffef;border:1px solid #fff8;border-radius:24px;padding:30px;box-shadow:0 30px 80px #07112e55;backdrop-filter:blur(18px)}.mark{width:55px;height:55px;border-radius:17px;background:#eaf0ff;display:grid;place-items:center;font-size:26px}.eyebrow{margin-top:18px;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#64708a}.card h1{margin:5px 0 8px}.sub{color:#68738a;font-size:13px;line-height:1.55}label{display:block;font-size:13px;font-weight:750;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #dbe2ee;border-radius:12px;font:inherit;background:#fbfcff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#3158d8;color:#fff;font:inherit;font-weight:800;cursor:pointer}.requirements{font-size:11px;color:#7b8495;margin-top:7px}.status{padding:12px;border-radius:11px;margin-top:13px;font-size:13px;display:none}.success{display:block;background:#e9f8f2;color:#09694f}.error{display:block;background:#fff0f1;color:#992631}</style></head><body id="appBody"><div class="card"><div class="mark">🔐</div><div class="eyebrow">Secure DMS</div><h1>Activate your account</h1><p class="sub">Set your own password to activate the employee account created for you.</p><label>Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Create a strong password"><div class="requirements">At least 8 characters, including uppercase, lowercase and a number.</div><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password"><button id="btn">Activate account</button><div id="status" class="status"></div></div><script>
const dept=(sessionStorage.getItem('department_type')||'').toLowerCase();document.body.dataset.department=dept;
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8000':'https://alliance-cqnf.onrender.com';const token=new URLSearchParams(location.search).get('token');const $=id=>document.getElementById(id);$('btn').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(!token){$('status').className='status error';$('status').textContent='Activation token is missing.';return}if(p!==c){$('status').className='status error';$('status').textContent='Passwords do not match.';return}try{const r=await fetch(API+'/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Activation failed.');$('status').className='status success';$('status').textContent='Account activated. Redirecting to login…';setTimeout(()=>location.href='login.html',900)}catch(e){$('status').className='status error';$('status').textContent=e.message}};
</script></body></html>
