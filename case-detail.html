<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Details</title>
<style>
body{font-family:system-ui;max-width:900px;margin:25px auto;padding:0 18px;background:#f8fafc;color:#172033}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:20px;margin:14px 0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:150px}
button{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;cursor:pointer;margin:4px 0}
.green{background:#047857}.gray{background:#475569}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px}
.file,.member,.result{padding:13px 0;border-bottom:1px solid #e5e7eb}.meta{color:#64748b;font-size:.85rem} .file-title{font-size:1.05rem;font-weight:700}.version-badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:.78rem;font-weight:600}.ocr-result{margin-top:10px;padding:12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;white-space:pre-wrap;line-height:1.5;max-height:320px;overflow:auto}.ocr-result.loading{color:#64748b}.ocr-result.error{background:#fef2f2;color:#991b1b}.ocr-result.success{background:#ecfdf5;color:#065f46}.integrity{margin:10px 0;padding:10px 12px;border-radius:8px;font-weight:600}.integrity.ok{background:#ecfdf5;color:#065f46}.integrity.warn{background:#fff7ed;color:#9a3412}.integrity.bad{background:#fef2f2;color:#991b1b}.ocr-confidence{font-size:.85rem;color:#475569;margin-bottom:6px}.ocr-text{white-space:pre-wrap;line-height:1.55;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px;max-height:360px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}
.hash{font-family:monospace;font-size:.72rem;word-break:break-all;background:#f1f5f9;padding:8px;border-radius:6px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:#fff;padding:24px;border-radius:14px;width:min(520px,92vw)}
.status{padding:10px;border-radius:8px;margin-top:8px;white-space:pre-wrap}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf5;color:#065f46}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{padding:8px;background:#f8fafc;border-radius:7px}
a{color:#2563eb}
</style>
</head>
<body>
<a href="homepage.html">← Back to homepage</a>

<div class="card">
  <div class="top">
    <div>
      <h1 id="title">Case</h1>
      
    </div>
  </div>
  <div class="tabs">
    <button id="filesBtn">📁 Files</button>
    <button id="uploadBtn">⬆ Upload Photos / Files</button>
    <button id="membersBtn">👥 Members</button>
  </div>
</div>

<div id="panel"></div>

<div id="otpModal" class="modal">
  <div class="box">
    <h2>Email verification</h2>
    <p id="otpStatus">A 6-digit code will be sent to your official email.</p>
    <input id="otpCode" maxlength="6" inputmode="numeric" placeholder="6-digit code">
    <button id="verifyOtpBtn">Verify</button>
    <button class="gray" id="cancelOtpBtn">Cancel</button>
  </div>
</div>

<script>
const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://127.0.0.1:8000"
    : "https://alliance-cqnf.onrender.com";
const token = sessionStorage.getItem("token");
const H = {"Authorization":"Bearer " + token};

const caseId = new URLSearchParams(window.location.search).get("case_id");
const titleEl = document.getElementById("title");
const panelEl = document.getElementById("panel");
const otpModalEl = document.getElementById("otpModal");
const otpCodeEl = document.getElementById("otpCode");
const otpStatusEl = document.getElementById("otpStatus");

if (!token) window.location.href = "login.html";
if (!caseId) window.location.href = "homepage.html";


function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
}

function errText(data) {
    if (typeof data?.detail === "string") return data.detail;
    if (Array.isArray(data?.detail)) {
        return data.detail.map(x => {
            const loc = Array.isArray(x.loc) ? x.loc.join(".") : "field";
            return loc + ": " + (x.msg || JSON.stringify(x));
        }).join("; ");
    }
    return data?.message || JSON.stringify(data);
}

async function api(path, options={}) {
    const response = await fetch(API + path, {
        ...options,
        headers: {...(options.headers || {}), ...H}
    });

    const raw = await response.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; }
    catch { data = {detail: raw}; }

    if (!response.ok) {
        throw new Error("HTTP " + response.status + ": " + errText(data));
    }
    return data;
}

let pendingPurpose = null;
let pendingAction = null;

async function protectedAction(purpose, action) {
    pendingPurpose = purpose;
    pendingAction = action;

    try {
        const data = await api("/security/request-otp", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({purpose, case_id:caseId})
        });

        otpStatusEl.textContent = data.message || "Enter the code sent to your official email.";
        otpCodeEl.value = "";
        otpModalEl.style.display = "flex";
        setTimeout(() => otpCodeEl.focus(), 50);
    } catch (error) {
        alert(error.message);
    }
}

async function verifyOtp() {
    try {
        await api("/security/verify-otp", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                purpose:pendingPurpose,
                case_id:caseId,
                code:otpCodeEl.value.trim()
            })
        });

        otpModalEl.style.display = "none";

        if (pendingAction) await pendingAction();

    } catch (error) {
        otpStatusEl.className = "status error";
        otpStatusEl.textContent = error.message;
    }
}

document.getElementById("verifyOtpBtn").addEventListener("click", verifyOtp);
document.getElementById("cancelOtpBtn").addEventListener("click", () => {
    otpModalEl.style.display = "none";
});

document.getElementById("filesBtn").addEventListener(
    "click", () => protectedAction("VIEW_FILES", showFiles)
);
document.getElementById("uploadBtn").addEventListener(
    "click", () => protectedAction("UPLOAD_FILE", showUpload)
);
document.getElementById("membersBtn").addEventListener(
    "click", () => protectedAction("MANAGE_MEMBERS", showMembers)
);

async function showFiles() {
    try {
        const data = await api("/case/documents?case_id=" + encodeURIComponent(caseId));
        const docs = Array.isArray(data.documents) ? data.documents : [];
        const warnings = docs.filter(x => x.integrity && x.integrity.status !== "VERIFIED");

        panelEl.innerHTML = `
        <div class="card">
            <h2>Files for this case</h2>
            ${warnings.length ? `
                <div class="integrity bad">
                    ⚠ Security warning: ${warnings.length} document${warnings.length > 1 ? "s" : ""} failed or could not complete an automatic integrity check. Review the warning shown on the affected document.
                </div>` : `
                <div class="integrity ok">✓ All displayed documents passed automatic integrity verification.</div>`}
            ${docs.length ? docs.map(fileHtml).join("") : `<p class="meta">No files visible to you.</p>`}
        </div>`;

        // OCR runs in the background after upload. Poll only records that are still processing.
        docs.forEach(d => {
            if (d.ocr?.status === "PROCESSING") pollOCR(d.version?.version_id);
        });
    } catch (error) {
        panelEl.innerHTML = `<div class="status error">${esc(error.message)}</div>`;
    }
}

function integrityHtml(i) {
    const status = i?.status || "UNKNOWN";
    if (status === "VERIFIED") {
        return `<div class="integrity ok">✓ Integrity verified automatically</div>`;
    }
    if (status === "WARNING") {
        return `<div class="integrity warn">⚠ ${esc(i.message || "Integrity verification requires attention.")}</div>`;
    }
    return `<div class="integrity bad">⚠ ${esc(i?.message || "Integrity could not be verified.")}</div>`;
}

function ocrHtml(v, ocr) {
    const status = ocr?.status || "NOT_STARTED";
    const id = esc(v?.version_id || "");
    if (status === "COMPLETED") {
        const confidence = ocr.confidence == null ? "Not available" : `${(Number(ocr.confidence) * 100).toFixed(1)}%`;
        const text = (ocr.extracted_text || "").trim();
        return `
            <div class="ocr-result success" id="ocr-${id}">
                <b>Extracted Text · OCR Version ${esc(ocr.ocr_version || 1)}</b>
                <div class="ocr-confidence">Confidence: ${esc(confidence)}</div>
                <div class="ocr-text">${esc(text || "No text could be detected.")}</div>
            </div>`;
    }
    if (status === "PROCESSING") {
        return `<div class="ocr-result loading" id="ocr-${id}">Extracting text automatically…</div>`;
    }
    if (status === "FAILED") {
        return `<div class="ocr-result error" id="ocr-${id}">OCR could not extract text from this document. The original file is unchanged.</div>`;
    }
    if (status === "NOT_CONFIGURED") {
        return `<div class="ocr-result error" id="ocr-${id}">OCR storage is not configured yet.</div>`;
    }
    return `<div class="ocr-result loading" id="ocr-${id}">OCR will be processed automatically.</div>`;
}

function fileHtml(x) {
    const v = x.version || {};
    const versionNo = v.version_number || 1;
    const versionId = esc(v.version_id || "");
    const canView = x.integrity?.status === "VERIFIED";
    return `
    <div class="file">
        <div class="file-title">Document <span class="version-badge">Version ${esc(versionNo)}</span></div>
        <div class="meta">Uploaded: ${esc(v.timestamp || "—")}</div>
        ${integrityHtml(x.integrity)}
        <div class="actions">
            ${canView
                ? `<button data-view="${versionId}">View Original</button>`
                : `<button disabled title="Viewing is blocked until integrity can be verified">View Original</button>`}
        </div>
        ${ocrHtml(v, x.ocr)}
    </div>`;
}

async function viewFile(id) {
    // Open a tab immediately so browser popup blockers do not reject the async response.
    const tab = window.open("about:blank", "_blank");
    try {
        if (!tab) throw new Error("Please allow pop-ups for this site to view the document.");
        const response = await fetch(API + "/documents/file/" + encodeURIComponent(id), {headers:H});
        if (!response.ok) {
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch { data = {detail:raw}; }
            throw new Error("HTTP " + response.status + ": " + errText(data));
        }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        tab.location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 120000);
    } catch (error) {
        if (tab && !tab.closed) tab.close();
        alert("Document could not be opened.\n\n" + error.message);
    }
}

async function pollOCR(id, tries=0) {
    if (!id || tries > 45) return;
    try {
        const data = await api("/documents/ocr/" + encodeURIComponent(id));
        const target = document.getElementById("ocr-" + id);
        if (!target) return;
        const v = {version_id:id};
        target.outerHTML = ocrHtml(v, data);
        if (data.status === "PROCESSING") {
            setTimeout(() => pollOCR(id, tries + 1), 4000);
        }
    } catch (_) {
        setTimeout(() => pollOCR(id, tries + 1), 5000);
    }
}

function showUpload() {
    panelEl.innerHTML = `
    <div class="card">
        <h2>Upload Photos / Files</h2>
        <label>Document type</label>
        <select id="documentType">
            <option value="evidence">Evidence</option>
            <option value="witness_statement">Witness Statement</option>
            <option value="forensic_report">Forensic Report</option>
            <option value="postmortem_report">Postmortem Report</option>
            <option value="charge_sheet">Charge Sheet</option>
            <option value="court_order">Court Order</option>
            <option value="judgment">Judgment</option>
        </select>
        <input id="uploadFileInput" type="file"
            accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.ppt,.pptx,.txt">
        <button id="uploadSubmit">Upload & Sign</button>
        <div id="uploadStatus"></div>
    </div>`;

    document.getElementById("uploadSubmit").addEventListener("click", upload);
}

async function upload() {
    const fileInput = document.getElementById("uploadFileInput");
    const typeInput = document.getElementById("documentType");
    const status = document.getElementById("uploadStatus");

    if (!fileInput.files.length) {
        status.className = "status error";
        status.textContent = "Choose a file.";
        return;
    }

    const fd = new FormData();
    fd.append("case_id", caseId);
    fd.append("document_type", typeInput.value);
    fd.append("file", fileInput.files[0]);

    try {
        const data = await api("/documents/upload", {
            method:"POST",
            body:fd
        });

        status.className = "status success";
        status.textContent = data.message || "Uploaded and signed.";
        setTimeout(showFiles, 500);
    } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
    }
}

async function showMembers() {
    try {
        const data = await api("/case/members?case_id=" + encodeURIComponent(caseId));

        let html = `
        <div class="card">
            <h2>Members</h2>
            ${
                data.members.map(m => `
                <div class="member">
                    <b>${esc(m.users?.employee_registry?.full_name || m.users?.employee_id || "User")}</b>
                    <div class="meta">
                        ${esc(m.permission_level)} ·
                        ${(m.allowed_document_types || []).map(esc).join(", ")}
                    </div>
                </div>`).join("")
            }`;

        if (data.my_access.permission_level === "grant") {
            html += `
                <hr>
                <h2>Add Member</h2>
                <input id="memberSearch" placeholder="Search employee name or ID">
                <div id="memberResults"></div>`;
        }

        html += "</div>";
        panelEl.innerHTML = html;

        const search = document.getElementById("memberSearch");
        if (search) {
            let timer;
            search.addEventListener("input", () => {
                clearTimeout(timer);
                const q = search.value.trim();
                if (q.length < 2) return;

                timer = setTimeout(() => searchMembers(q), 250);
            });
        }

    } catch (error) {
        panelEl.innerHTML = `<div class="status error">${esc(error.message)}</div>`;
    }
}

async function searchMembers(q) {
    const results = document.getElementById("memberResults");

    try {
        const data = await api(
            "/case/search-members?case_id=" +
            encodeURIComponent(caseId) +
            "&q=" + encodeURIComponent(q)
        );

        results.innerHTML = data.length
            ? data.map(x => `
                <div class="result">
                    <b>${esc(x.full_name)}</b>
                    <div class="meta">${esc(x.employee_id)} · ${esc(x.official_email)}</div>
                    <button data-select-member="${esc(x.employee_id)}">Select</button>
                </div>`).join("")
            : `<p class="meta">No results.</p>`;

        results.querySelectorAll("[data-select-member]").forEach(btn => {
            btn.addEventListener("click", () => openGrant(btn.dataset.selectMember));
        });

    } catch (error) {
        results.innerHTML = `<div class="status error">${esc(error.message)}</div>`;
    }
}

async function openGrant(employeeId) {
    try {
        const data = await api(
            "/case/invite-options?case_id=" + encodeURIComponent(caseId)
        );

        const checks = data.allowed_document_types.map(t => `
            <label class="check">
                <input type="checkbox" class="grantType" checked value="${esc(t)}">
                ${esc(t.replaceAll("_"," "))}
            </label>`).join("");

        panelEl.innerHTML = `
        <div class="card">
            <h2>Grant Access</h2>
            <p>Employee: <b>${esc(employeeId)}</b></p>

            <label>Permission</label>
            <select id="permission">
                <option value="read">Read only</option>
                <option value="upload">Upload</option>
                <option value="sign">Sign</option>
                <option value="grant">Grant</option>
            </select>

            <label>Documents</label>
            <div class="checks">${checks}</div>

            <button id="confirmGrant">Confirm Grant</button>
            <button class="gray" id="cancelGrant">Cancel</button>
            <div id="grantStatus"></div>
        </div>`;

        document.getElementById("confirmGrant")
            .addEventListener("click", () => submitGrant(employeeId));
        document.getElementById("cancelGrant")
            .addEventListener("click", showMembers);

    } catch (error) {
        alert(error.message);
    }
}

async function submitGrant(employeeId) {
    const types = [...document.querySelectorAll(".grantType:checked")]
        .map(x => x.value);

    const status = document.getElementById("grantStatus");

    if (!types.length) {
        status.className = "status error";
        status.textContent = "Select at least one document type.";
        return;
    }

    try {
        const data = await api("/case/invite", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                case_id:caseId,
                employee_id:employeeId,
                permission_level:document.getElementById("permission").value,
                allowed_document_types:types
            })
        });

        status.className = "status success";
        status.textContent = data.message || "Access granted.";
        setTimeout(showMembers, 700);

    } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
    }
}
</script>
</body>
</html>
