<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure DMS — Case</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1050px;margin:25px auto;padding:0 18px;background:#f8fafc;color:#172033}
a{color:#2563eb}.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:20px;margin:14px 0}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:180px}button{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;cursor:pointer;margin:4px 0}button:disabled{opacity:.6;cursor:not-allowed}.green{background:#047857}.gray{background:#475569}.red{background:#b91c1c}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 10px}textarea{min-height:180px;resize:vertical}.file,.member,.result{padding:16px 0;border-bottom:1px solid #e5e7eb}.meta{color:#64748b;font-size:.88rem}.status{padding:11px;border-radius:9px;margin-top:10px;white-space:pre-wrap}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf5;color:#065f46}.warning{background:#fff7ed;color:#9a3412}.info{background:#f1f5f9;color:#475569}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{padding:8px;background:#f8fafc;border-radius:7px}.ocr-box, .ai-box{margin-top:12px;border:1px solid #dbe2ea;border-radius:10px;padding:14px;background:#fff}.ocr-text{white-space:pre-wrap;line-height:1.5;max-height:420px;overflow:auto;background:#f8fafc;padding:12px;border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20}.box{background:#fff;padding:24px;border-radius:14px;width:min(520px,92vw);max-height:90vh;overflow:auto}.viewer{width:min(1100px,94vw);height:min(90vh,850px);background:#fff;padding:18px;border-radius:14px;display:flex;flex-direction:column}.viewer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}.viewer-pane{border:1px solid #dbe2ea;border-radius:10px;padding:10px;min-height:0;overflow:auto}.viewer-frame{width:100%;height:100%;min-height:500px;border:0}.member-tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e0e7ff;margin:3px 4px 3px 0;font-size:.78rem}.hidden{display:none}@media(max-width:750px){.viewer-grid{grid-template-columns:1fr}.viewer-frame{min-height:350px}.checks{grid-template-columns:1fr}}
.ai-tracker{margin-top:12px;border:1px solid #dbe2ea;border-radius:10px;padding:14px;background:#f8fafc}.progress-wrap{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0}.progress-bar{height:100%;background:#2563eb;border-radius:99px;transition:width .4s}.tracker-row{display:flex;gap:10px;align-items:center;margin:7px 0;font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}.dot.done{background:#059669}.dot.active{background:#2563eb;box-shadow:0 0 0 4px #dbeafe}.dot.fail{background:#dc2626}.pdf-shell{height:100%;min-height:500px;background:#f1f5f9;border-radius:8px;overflow:auto;padding:12px}.pdf-page{display:block;margin:0 auto 14px;max-width:100%;box-shadow:0 1px 4px #0002;background:#fff}.preview-note{padding:18px;background:#f8fafc;border-radius:8px;color:#475569}.viewer-pane{position:relative}.viewer-toolbar{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-bottom:6px}.viewer-toolbar button{margin:0;padding:7px 10px}.viewer-title{font-weight:700;margin-right:auto}.elapsed{font-variant-numeric:tabular-nums}.small{font-size:.8rem}@media(max-width:750px){.pdf-shell{min-height:350px}}</style>
</head>
<body>
<a href="homepage.html">← Back to homepage</a>
<div class="card">
  <h1>Case</h1>
  <div class="tabs">
    <button type="button" id="filesBtn">📁 Files</button>
    <button type="button" id="uploadBtn">⬆ Upload Photos / Files</button>
    <button type="button" id="membersBtn">👥 Members</button>
    <button type="button" id="aiBtn">🤖 Case AI</button>
  </div>
</div>
<div id="panel"></div>

<div id="otpModal" class="modal"><div class="box">
  <h2>Email verification</h2>
  <p id="otpStatus">A 6-digit code will be sent to your official email.</p>
  <input id="otpCode" maxlength="6" inputmode="numeric" placeholder="6-digit code">
  <button id="verifyOtpBtn">Verify</button>
  <button class="gray" id="cancelOtpBtn">Cancel</button>
</div></div>

<div id="viewerModal" class="modal"><div class="viewer">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Document View</h2><button class="gray" id="closeViewer">Close</button></div>
  <div id="viewerStatus"></div>
  <div class="viewer-grid">
    <div class="viewer-pane">
      <div class="viewer-toolbar"><span class="viewer-title">Original Document</span><button id="pdfZoomOut" class="gray">−</button><button id="pdfZoomIn" class="gray">+</button></div>
      <div id="pdfViewer" class="pdf-shell"></div>
    </div>
    <div class="viewer-pane"><h3>Extracted Text</h3><div id="viewerOcr"></div></div>
  </div>
</div></div>

<script>
let pdfjsReady = import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs').then(m=>{window.pdfjsLib=m;window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';});
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8000':'https://alliance-cqnf.onrender.com';
const token=sessionStorage.getItem('token');
const H={'Authorization':'Bearer '+token};
const caseId=new URLSearchParams(location.search).get('case_id');
const panelEl=document.getElementById('panel');
const otpModal=document.getElementById('otpModal');
const otpCode=document.getElementById('otpCode');
const otpStatus=document.getElementById('otpStatus');
const viewerModal=document.getElementById('viewerModal');
const viewerOcr=document.getElementById('viewerOcr');
const viewerStatus=document.getElementById('viewerStatus');
if(!token) location.href='login.html';
if(!caseId) location.href='homepage.html';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function errText(d){if(typeof d?.detail==='string')return d.detail;if(Array.isArray(d?.detail))return d.detail.map(x=>(Array.isArray(x.loc)?x.loc.join('.'):'field')+': '+(x.msg||JSON.stringify(x))).join('; ');return d?.message||JSON.stringify(d);}
async function api(path,options={}){const method=(options.method||'GET').toUpperCase();let lastError=null;for(let attempt=0;attempt<(method==='GET'?3:1);attempt++){try{const response=await fetch(API+path,{...options,headers:{...(options.headers||{}),...H}});const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{};}catch{data={detail:raw}}if(!response.ok){const message=errText(data);if(method==='GET'&&[500,502,503,504].includes(response.status)&&attempt<2){await new Promise(r=>setTimeout(r,700*(attempt+1)));continue;}throw new Error('HTTP '+response.status+': '+message);}return data;}catch(e){lastError=e;if(method==='GET'&&attempt<2){await new Promise(r=>setTimeout(r,700*(attempt+1)));continue;}throw e;}}throw lastError||new Error('Request failed');}
let pendingPurpose=null,pendingAction=null;
async function protectedAction(purpose,action){pendingPurpose=purpose;pendingAction=action;try{const d=await api('/security/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose,case_id:caseId})});otpStatus.textContent=d.message||'Enter the code sent to your official email.';otpCode.value='';otpModal.style.display='flex';setTimeout(()=>otpCode.focus(),50);}catch(e){alert(e.message);}}
async function verifyOtp(){try{await api('/security/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose:pendingPurpose,case_id:caseId,code:otpCode.value.trim()})});otpModal.style.display='none';if(pendingAction)await pendingAction();}catch(e){otpStatus.className='status error';otpStatus.textContent=e.message;}}
document.getElementById('verifyOtpBtn').onclick=verifyOtp;document.getElementById('cancelOtpBtn').onclick=()=>otpModal.style.display='none';
document.getElementById('filesBtn').onclick=()=>protectedAction('VIEW_FILES',showFiles);
document.getElementById('uploadBtn').onclick=showUpload;
document.getElementById('membersBtn').onclick=()=>protectedAction('MANAGE_MEMBERS',showMembers);document.getElementById('aiBtn').onclick=()=>protectedAction('VIEW_FILES',showAI);

function formatDuration(sec){sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),s=sec%60;return m?`${m}m ${s}s`:`${s}s`;}
function stageLabel(stage){const map={queued:'Queued — waiting for AI worker',downloading_document:'Reading secured document',document_loaded:'Document loaded',sending_to_ai:'Sending document to AI',ollama_request:'Ollama is processing the document',gemini_request:'Gemini is processing the document',ollama_failed_switching_to_gemini:'Ollama unavailable — switching to Gemini',native_extraction_complete:'Text extracted locally — AI was not required',ai_extraction_complete:'AI extraction completed',creating_searchable_chunks:'Creating searchable case chunks',saving_extracted_text:'Saving extracted text',completed:'Completed',failed:'Failed'};if(stage?.startsWith('ollama_page_')){const n=stage.match(/ollama_page_(\d+)(?:_complete)?/);return n?`Ollama is processing page ${n[1]}`:'Ollama is processing';}return map[stage]||'Processing document';}
function trackerStep(label,state){return `<div class="tracker-row"><span class="dot ${state}"></span>${label}</div>`;}
function aiTracker(a){const status=a.status||'not_started',stage=a.stage||'queued',pct=Math.max(0,Math.min(100,Number(a.progress_percent||0)));if(status==='not_started')return '<div class="status info">AI extraction has not been queued for this version.</div>';if(status==='completed'){const native=a.provider==='native';return `<div class="status success">✓ ${native?'Text extraction completed — AI was not required':'AI extraction completed'}${a.completed_at?' · '+esc(new Date(a.completed_at).toLocaleString()):''}</div><div class="meta">${native?'This document already contained searchable text, so no cloud AI request was needed.':'Saved extraction will be reused; reopening this document will not reprocess it.'}</div>`;}if(status==='failed')return `<div class="status error">✗ AI extraction failed<br><span class="small">${esc(a.error||'Unknown AI processing error.')}</span></div>${a.started_at?'<div class="meta">Started: '+esc(new Date(a.started_at).toLocaleString())+'</div>':''}<button class="gray" data-ai-retry="${esc(a.version_id||'')}">Retry extraction</button>`;let eta='';if(a.started_at&&a.estimated_seconds){const elapsed=(Date.now()-new Date(a.started_at).getTime())/1000;const remaining=Math.max(0,Number(a.estimated_seconds)-elapsed);eta=remaining>0?`Estimated remaining: ~${formatDuration(remaining)}`:'Taking longer than the initial estimate — still working.';}else if(a.estimated_seconds){eta=`Estimated processing time: ~${formatDuration(a.estimated_seconds)}`;}const native=a.provider==='native'||stage==='native_extraction_complete';const aiReached=native?false:!['queued','downloading_document','document_loaded'].includes(stage);const chunkReached=['creating_searchable_chunks','saving_extracted_text'].includes(stage);return `<div class="ai-tracker"><b>AI document processing</b><div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div><b>${pct}%</b> · ${esc(stageLabel(stage))}</div><div class="meta">${eta}${a.started_at?' · Elapsed: <span class="elapsed" data-start="'+esc(a.started_at)+'">—</span>':''}</div>${trackerStep('Document uploaded & secured','done')}${trackerStep('Integrity verified automatically','done')}${trackerStep('Processing job created',stage==='queued'?'active':'done')}${trackerStep('Document loaded',aiReached||stage==='document_loaded'?'done':'active')}${trackerStep(native?'AI provider not required — native text extraction': 'Reached AI provider',native?'done':(aiReached?'done':(stage==='document_loaded'?'active':'pending')))}${trackerStep('Extracting text',chunkReached?'done':'active')}${trackerStep('Creating searchable chunks',chunkReached?'active':'pending')}</div>`;}
function activityHtml(jobs){if(!jobs?.length)return '<p class="meta">No AI processing jobs yet.</p>';return jobs.map(j=>`<div class="file"><b>${esc((j.document_type||'Document').replaceAll('_',' '))}</b> · ${esc(j.status||'pending')}<div class="meta">${esc(stageLabel(j.stage))}${j.provider?' · Provider: '+esc(j.provider):''}${j.model?' · Model: '+esc(j.model):''}</div>${aiTracker(j)}</div>`).join('');}


function showUpload(){panelEl.innerHTML='<div class="card"><h2>Upload Photos / Files</h2><p class="meta">Select the document type and file. Your email OTP will be requested only when you click Upload & Sign.</p><label>Document type</label><select id="dtype"><option value="evidence">Evidence</option><option value="witness_statement">Witness Statement</option><option value="forensic_report">Forensic Report</option><option value="postmortem_report">Postmortem Report</option><option value="charge_sheet">Charge Sheet</option><option value="court_order">Court Order</option><option value="judgment">Judgment</option><option value="suspect_interview">Suspect Interview</option><option value="medical_report">Medical Report</option><option value="cctv">CCTV</option><option value="other">Other</option></select><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.ppt,.pptx,.txt"><button id="uploadSubmit" class="green">Upload & Sign</button><div id="uploadStatus"></div></div>';document.getElementById('uploadSubmit').onclick=()=>protectedAction('UPLOAD_FILE',doUpload);}
async function doUpload(){const f=document.getElementById('file')?.files?.[0],status=document.getElementById('uploadStatus');if(!f){status.className='status error';status.textContent='Choose a file first.';return;}const button=document.getElementById('uploadSubmit');button.disabled=true;status.className='status info';status.textContent='Uploading, securing and signing the document…';try{const fd=new FormData();fd.append('case_id',caseId);fd.append('document_type',document.getElementById('dtype').value);fd.append('file',f);const d=await api('/documents/upload',{method:'POST',body:fd});status.className='status success';status.textContent=d.message||'File uploaded successfully.';setTimeout(showFiles,700);}catch(e){status.className='status error';status.textContent=e.message;}finally{button.disabled=false;}}

async function showFiles(){try{const data=await api('/case/documents?case_id='+encodeURIComponent(caseId));const docs=data.documents||[];let html='<div class="card"><h2>Files for this case</h2>';if(data.integrity_warning_count>0)html+='<div class="status warning">⚠ Security warning: '+data.integrity_warning_count+' document(s) could not be automatically verified. Viewing is blocked for affected documents.</div>';if(!docs.length)html+='<p class="meta">No files visible to you.</p>';docs.forEach(x=>html+=fileHtml(x));html+='</div>';panelEl.innerHTML=html;startAiPolling(docs);startElapsedTicker();}catch(e){panelEl.innerHTML='<div class="status error">'+esc(e.message)+'</div>';}}
function fileHtml(x){const v=x.version||{},i=x.integrity||{},a=x.ai||{};let integrity=i.valid?'<div class="status success">✓ Integrity verified automatically</div>':'<div class="status warning">⚠ '+esc(i.message||'Integrity could not be verified. Viewing is blocked.')+'</div>';return '<div class="file"><b>'+esc(x.filename||'Document')+'</b> <span class="member-tag">Version '+esc(v.version_number||1)+'</span><div class="meta">Type: '+esc(x.document_type||'')+' · Uploaded: '+esc(v.timestamp||'—')+'</div>'+integrity+aiTracker(a)+'<button data-view="'+esc(v.version_id||'')+'" '+(!i.valid?'disabled':'')+'>View Document</button></div>';}
let aiPollTimer=null,elapsedTimer=null;
function startElapsedTicker(){if(elapsedTimer)clearInterval(elapsedTimer);elapsedTimer=setInterval(()=>{document.querySelectorAll('[data-start]').forEach(el=>{const t=new Date(el.dataset.start).getTime();if(Number.isFinite(t))el.textContent=formatDuration((Date.now()-t)/1000);});},1000);}
function startAiPolling(docs){if(aiPollTimer)clearInterval(aiPollTimer);if(!(docs||[]).some(x=>['pending','processing'].includes((x.ai||{}).status)))return;aiPollTimer=setInterval(async()=>{try{const data=await api('/case/documents?case_id='+encodeURIComponent(caseId));const list=data.documents||[];let card='<div class="card"><h2>Files for this case</h2>'+(data.integrity_warning_count>0?'<div class="status warning">⚠ Security warning: '+data.integrity_warning_count+' document(s) could not be automatically verified. Viewing is blocked for affected documents.</div>':'')+(list.length?list.map(fileHtml).join(''):'<p class="meta">No files visible to you.</p>')+'</div>';panelEl.innerHTML=card;startElapsedTicker();if(!list.some(x=>['pending','processing'].includes((x.ai||{}).status))){clearInterval(aiPollTimer);aiPollTimer=null;}}catch{}} ,2000);}

panelEl.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&!b.disabled){openDocument(b.dataset.view);return;}const r=e.target.closest('[data-ai-retry]');if(r)retryAi(r.dataset.aiRetry);});

let viewerPollTimer=null,currentViewerUrl=null,pdfDoc=null,pdfScale=1;
function closeViewer(){viewerModal.style.display='none';document.getElementById('pdfViewer').innerHTML='';viewerOcr.innerHTML='';viewerStatus.innerHTML='';if(viewerPollTimer)clearInterval(viewerPollTimer);viewerPollTimer=null;pdfDoc=null;currentViewerUrl=null;}
document.getElementById('closeViewer').onclick=closeViewer;
document.getElementById('pdfZoomIn').onclick=()=>{pdfScale=Math.min(2.5,pdfScale+.2);renderPdf();};
document.getElementById('pdfZoomOut').onclick=()=>{pdfScale=Math.max(.6,pdfScale-.2);renderPdf();};
async function renderPdf(){if(!pdfDoc)return;const shell=document.getElementById('pdfViewer');shell.innerHTML='';for(let n=1;n<=pdfDoc.numPages;n++){const page=await pdfDoc.getPage(n);const base=page.getViewport({scale:1});const maxW=Math.max(300,shell.clientWidth-24);const scale=Math.min(maxW/base.width,1.6)*pdfScale;const vp=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.className='pdf-page';canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);shell.appendChild(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;}}
async function showOriginalBlob(blob, filename){await pdfjsReady;const shell=document.getElementById('pdfViewer');shell.innerHTML='<div class="preview-note">Loading secure original preview…</div>';const lower=(filename||'').toLowerCase();try{const type=blob.type||'';if(type.includes('pdf')||lower.endsWith('.pdf')){const buf=await blob.arrayBuffer();pdfDoc=await window.pdfjsLib.getDocument({data:buf}).promise;pdfScale=1;await renderPdf();}else if(type.startsWith('image/')||/\.(png|jpe?g|webp|bmp|gif)$/i.test(lower)){const img=document.createElement('img');img.src=URL.createObjectURL(blob);img.style.maxWidth='100%';img.style.display='block';img.style.margin='0 auto';shell.innerHTML='';shell.appendChild(img);}else{shell.innerHTML='<div class="preview-note">This file type cannot be rendered in the browser preview. The secured original remains protected; extracted text is shown on the right.</div>';}}catch(e){shell.innerHTML='<div class="status warning">Original preview could not be rendered. '+esc(e.message)+'</div>';}}
async function fetchOriginalPreview(id){const r=await fetch(API+'/documents/preview/'+encodeURIComponent(id),{headers:H});if(!r.ok){let d={};try{d=await r.json();}catch{d={detail:await r.text()}}throw new Error('HTTP '+r.status+': '+errText(d));}return {blob:await r.blob(),filename:r.headers.get('Content-Disposition')||''};}
async function refreshViewerAI(id){try{const ai=await api('/documents/ai-status/'+encodeURIComponent(id));viewerOcr.innerHTML=viewerText(ai);if(ai.status==='completed'||ai.status==='failed'){if(viewerPollTimer)clearInterval(viewerPollTimer);viewerPollTimer=null;}else if(!viewerPollTimer){viewerPollTimer=setInterval(()=>refreshViewerAI(id),2000);}}catch(e){viewerOcr.innerHTML='<div class="status warning">'+esc(e.message)+'</div>';}}
async function openDocument(id){viewerStatus.innerHTML='<div class="status info">Checking integrity and opening the authorized original…</div>';viewerOcr.innerHTML='<div class="status info">Checking AI processing status…</div>';document.getElementById('pdfViewer').innerHTML='';viewerModal.style.display='flex';try{const [file,ai]=await Promise.all([fetchOriginalPreview(id),api('/documents/ai-status/'+encodeURIComponent(id))]);viewerStatus.innerHTML='<div class="status success">✓ Integrity verified automatically. Original document is authorized for viewing.</div>';currentViewerUrl=null;await showOriginalBlob(file.blob,file.filename);viewerOcr.innerHTML=viewerText(ai);if(['pending','processing'].includes(ai.status)){if(viewerPollTimer)clearInterval(viewerPollTimer);viewerPollTimer=setInterval(()=>refreshViewerAI(id),2000);}}catch(e){viewerStatus.innerHTML='<div class="status warning">⚠ '+esc(e.message)+'</div>';viewerOcr.innerHTML='';}}

async function showAI(){try{const d=await api('/case/ai/status?case_id='+encodeURIComponent(caseId));let html='<div class="card ai-box"><h2>🤖 Case AI</h2><div class="status '+(d.enabled?'success':'info')+'"><b>Status: '+(d.enabled?'🟢 ENABLED':'⚪ DISABLED')+'</b></div><div class="meta"><b>Case Head:</b> '+esc(d.head_name||'Not assigned')+' · <b>Provider:</b> '+esc(d.provider||'ollama+gemini-fallback')+' · <b>Model:</b> '+esc(d.model||'—')+'</div>';if(d.enabled){html+='<p>AI is enabled for this case. Documents are processed once per immutable version and the saved extraction is reused.</p>';if(d.is_head)html+='<button id="aiDisable" class="red">Disable Case AI</button><button id="closeCase" class="gray">Close Case</button>';}else{html+='<p>Case AI is currently off. Only the Case Head can enable it.</p>';if(d.is_head)html+='<button id="aiEnable" class="green">Enable Case AI</button>';else html+='<p class="meta">You are not the Case Head for this case.</p>';}if(d.pending_count)html+='<div class="status info">'+esc(d.pending_count)+' document(s) currently being processed. Open Files to see live progress.</div>';html+='</div>';if(d.status_warning)html+='<div class="status warning">⚠ '+esc(d.status_warning)+'</div>';html+='<div class="card" id="aiActivity"><h3>AI Processing Activity</h3>'+activityHtml(d.jobs)+'</div>';if(d.enabled)html+='<div class="card"><h2>Ask about this case</h2><textarea id="aiQuestion" style="min-height:110px" placeholder="Ask a question using only the documents in this case…"></textarea><button id="aiAsk">Ask Case AI</button><div id="aiAnswer"></div></div>';panelEl.innerHTML=html;const en=document.getElementById('aiEnable'),dis=document.getElementById('aiDisable'),closeBtn=document.getElementById('closeCase');if(en)en.onclick=()=>protectedAction('MANAGE_MEMBERS',async()=>{await setCaseAI(true);await showAI();});if(dis)dis.onclick=()=>protectedAction('MANAGE_MEMBERS',async()=>{await setCaseAI(false);await showAI();});if(closeBtn)closeBtn.onclick=()=>protectedAction('MANAGE_MEMBERS',async()=>{if(!confirm('Close this case? External participant accounts will be permanently deleted and cannot be restored.'))return;await api('/case/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId})});alert('Case closed. External access has been removed.');await showAI();});const ask=document.getElementById('aiAsk');if(ask)ask.onclick=askCaseAI;startElapsedTicker();if((d.jobs||[]).some(j=>['pending','processing'].includes(j.status)))startAiActivityPolling();}catch(e){panelEl.innerHTML='<div class="status error">'+esc(e.message)+'</div>';}}
async function setCaseAI(enabled){const d=await api('/case/ai/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,enabled})});return d;}
let aiActivityTimer=null;
function startAiActivityPolling(){if(aiActivityTimer)clearInterval(aiActivityTimer);aiActivityTimer=setInterval(async()=>{try{const d=await api('/case/ai/status?case_id='+encodeURIComponent(caseId));const box=document.getElementById('aiActivity');if(box)box.innerHTML='<h3>AI Processing Activity</h3>'+activityHtml(d.jobs);startElapsedTicker();if(!(d.jobs||[]).some(j=>['pending','processing'].includes(j.status))){clearInterval(aiActivityTimer);aiActivityTimer=null;}}catch{}} ,2000);}
async function retryAi(versionId){
    if(!versionId)return;
    try{
        await protectedAction('VIEW_FILES',async()=>{
            try{
                await api('/case/ai/retry?version_id='+encodeURIComponent(versionId),{method:'POST'});
                await showAI();
            }catch(e){
                // A lost POST response can happen after the server queued the job.
                // The document status is authoritative.
                try{
                    const st=await api('/documents/ai-status/'+encodeURIComponent(versionId));
                    if(['pending','processing'].includes(st.status)){
                        await showAI();
                        return;
                    }
                }catch(_){ }
                throw e;
            }
        });
    }catch(e){alert(e.message);}
}
async function askCaseAI(){const q=document.getElementById('aiQuestion'),out=document.getElementById('aiAnswer'),btn=document.getElementById('aiAsk');if(!q||!q.value.trim())return;const question=q.value.trim();out.className='status info';out.textContent='Case AI is searching the completed document extractions…';if(btn)btn.disabled=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),120000);try{const d=await api('/case/ai/chat',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,question})});let meta='Provider: '+(d.provider||'AI')+' · Sources: '+(d.context_chunks||0)+' · Response time: '+((d.latency_ms||0)/1000).toFixed(1)+'s';out.className='status success';out.innerHTML='<b>Case AI</b><br>'+esc(d.answer||'No answer returned.')+'<div class="meta" style="margin-top:10px">'+esc(meta)+'</div>';}catch(e){out.className='status error';out.textContent=e.name==='AbortError'?'The AI response took longer than 120 seconds. The server may be waiting for an AI provider. Please try again.':e.message;}finally{clearTimeout(timer);if(btn)btn.disabled=false;}}

async function showMembers(){try{const data=await api('/case/members?case_id='+encodeURIComponent(caseId));let html='<div class="card"><h2>Members</h2>';const members=data.members||[];if(members.length)members.forEach(m=>{const u=m.users||{};html+='<div class="member"><b>'+esc(u.employee_registry?.full_name||u.employee_id||'User')+'</b><div class="meta">'+esc(m.permission_level||'')+' · '+(m.allowed_document_types||[]).map(esc).join(', ')+'</div></div>';});else html+='<p class="meta">No internal members found.</p>';const ext=data.external_participants||[];if(ext.length){html+='<h3 style="margin-top:24px">External Participants</h3>';ext.forEach(p=>html+='<div class="member"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.organization_name||'')+' · '+esc(p.role||'')+' · '+esc(p.status||'')+'</div><div class="meta">'+(p.allowed_document_types||[]).map(t=>'<span class="member-tag">'+esc(t.replaceAll('_',' '))+'</span>').join('')+'</div></div>');}if(data.my_access?.permission_level==='grant')html+='<hr><h2>Add Member</h2><input id="memberSearch" placeholder="Search employee name or ID"><div id="memberResults"></div><button class="green" id="externalOpen">+ Invite External Participant</button><div id="externalPanel"></div>';html+='</div>';panelEl.innerHTML=html;const search=document.getElementById('memberSearch');if(search){let timer;search.oninput=()=>{clearTimeout(timer);const q=search.value.trim();if(q.length<2){document.getElementById('memberResults').innerHTML='';return;}timer=setTimeout(()=>searchMembers(q),250);};}const extBtn=document.getElementById('externalOpen');if(extBtn)extBtn.onclick=openExternalInvite;}catch(e){panelEl.innerHTML='<div class="status error">'+esc(e.message)+'</div>';}}
async function searchMembers(q){const results=document.getElementById('memberResults');try{const data=await api('/case/search-members?case_id='+encodeURIComponent(caseId)+'&q='+encodeURIComponent(q));results.innerHTML=data.length?data.map(x=>'<div class="result"><b>'+esc(x.full_name)+'</b><div class="meta">'+esc(x.employee_id)+' · '+esc(x.official_email)+'</div><button data-select-member="'+esc(x.employee_id)+'">Select</button></div>').join(''):'<p class="meta">No results.</p>';results.querySelectorAll('[data-select-member]').forEach(b=>b.onclick=()=>openGrant(b.dataset.selectMember));}catch(e){results.innerHTML='<div class="status error">'+esc(e.message)+'</div>';}}
async function openGrant(employeeId){try{const d=await api('/case/invite-options?case_id='+encodeURIComponent(caseId));const checks=(d.allowed_document_types||[]).map(t=>'<label class="check"><input type="checkbox" class="grantType" checked value="'+esc(t)+'"> '+esc(t.replaceAll('_',' '))+'</label>').join('');panelEl.innerHTML='<div class="card"><h2>Grant Access</h2><p>Employee: <b>'+esc(employeeId)+'</b></p><label>Permission</label><select id="permission"><option value="read">Read only</option><option value="upload">Upload</option><option value="sign">Sign</option><option value="grant">Grant</option></select><label>Documents</label><div class="checks">'+checks+'</div><button id="confirmGrant">Confirm Grant</button><button class="gray" id="cancelGrant">Cancel</button><div id="grantStatus"></div></div>';document.getElementById('confirmGrant').onclick=()=>submitGrant(employeeId);document.getElementById('cancelGrant').onclick=showMembers;}catch(e){alert(e.message);}}
async function submitGrant(employeeId){const types=[...document.querySelectorAll('.grantType:checked')].map(x=>x.value),status=document.getElementById('grantStatus');if(!types.length){status.className='status error';status.textContent='Select at least one document type.';return;}try{const d=await api('/case/invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,employee_id:employeeId,permission_level:document.getElementById('permission').value,allowed_document_types:types})});status.className='status success';status.textContent=d.message||'Access granted.';setTimeout(showMembers,700);}catch(e){status.className='status error';status.textContent=e.message;}}
async function openExternalInvite(){try{const d=await api('/case/invite-options?case_id='+encodeURIComponent(caseId));const checks=(d.allowed_document_types||[]).map(t=>'<label class="check"><input type="checkbox" class="extType" checked value="'+esc(t)+'"> '+esc(t.replaceAll('_',' '))+'</label>').join('');const orgs=(d.external_organization_types||['police','fsl','government_hospital','private_hospital','private_lab','court','prosecution','media','legal','academic','ngo','other']).map(x=>'<option value="'+esc(x)+'">'+esc(x.replaceAll('_',' '))+'</option>').join('');document.getElementById('externalPanel').innerHTML='<div class="card"><h2>Invite External Participant</h2><label>Full name</label><input id="extName"><label>Email</label><input id="extEmail" type="email"><label>Organization</label><input id="extOrg"><label>Organization type</label><select id="extOrgType">'+orgs+'</select><label>Role / Profession</label><input id="extRole" placeholder="Doctor, FSL analyst, lawyer, journalist, expert…"><label>Purpose</label><textarea id="extPurpose" style="min-height:80px" placeholder="Why is this participant being given access?"></textarea><label>Permission</label><select id="extPermission"><option value="read">Read only</option><option value="upload">Upload</option><option value="sign">Sign</option></select><label>Access duration</label><select id="extHours"><option value="24">24 hours</option><option value="72" selected>72 hours</option><option value="168">7 days</option></select><label>Documents</label><div class="checks">'+checks+'</div><button class="green" id="sendExternal">Send Invitation</button><button class="gray" id="cancelExternal">Cancel</button><div id="extStatus"></div></div>';document.getElementById('sendExternal').onclick=sendExternal;document.getElementById('cancelExternal').onclick=showMembers;}catch(e){alert(e.message);}}
async function sendExternal(){const status=document.getElementById('extStatus'),types=[...document.querySelectorAll('.extType:checked')].map(x=>x.value);const payload={case_id:caseId,name:document.getElementById('extName').value.trim(),email:document.getElementById('extEmail').value.trim(),organization_name:document.getElementById('extOrg').value.trim(),organization_type:document.getElementById('extOrgType').value,role:document.getElementById('extRole').value.trim()||'external_participant',purpose:document.getElementById('extPurpose').value.trim(),permission_level:document.getElementById('extPermission').value,allowed_document_types:types,expires_hours:Number(document.getElementById('extHours').value)};if(!payload.name||!payload.email||!types.length){status.className='status error';status.textContent='Name, email and at least one document type are required.';return;}try{const d=await api('/case/invite-external',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});status.className='status success';status.textContent=d.message||'External invitation sent.';setTimeout(showMembers,1000);}catch(e){status.className='status error';status.textContent=e.message;}}
</script>
